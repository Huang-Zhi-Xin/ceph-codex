<div cdsCol
     [columnNumbers]="{md: 4}">
  <ng-container *cdFormLoading="loading">
    <form name="roleForm"
          #formDir="ngForm"
          [formGroup]="roleForm"
          novalidate>
      <div class="form-header">{{ formTitle }}
      </div>
        <!--Name -->
      <div class="form-item">
        <cds-text-label for="name"
                        [cdRequiredField]="nameLabel"
                        [invalid]="!roleForm.controls.name.valid && roleForm.controls.name.dirty"
                        [invalidText]="nameError">{{ nameLabel }}
          <span [ngClass]="{'required': mode !== roleFormMode.editing}"></span>
          <input cdsText
                 [placeholder]="namePlaceholder"
                 id="name"
                 name="name"
                 formControlName="name"
                 [invalid]="!roleForm.controls.name.valid && roleForm.controls.name.dirty"
                 autofocus>
        </cds-text-label>
        <ng-template #nameError>
          <span *ngIf="roleForm.showError('name', formDir, 'required')">
            <ng-container i18n>
               This field is required.
            </ng-container>
          </span>
          <span *ngIf="roleForm.showError('name', formDir, 'notUnique')">
            <ng-container i18n>
                The chosen name is already in use.
            </ng-container>
          </span>
        </ng-template>
      </div>
    <!-- Description -->
      <div class="form-item">
        <cds-text-label for="name">{{ descriptionLabel }}
        <input cdsText
               type="text"
               class="input-field"
               [placeholder]="descriptionPlaceholder"
               id="description"
               name="description"
               formControlName="description">
        </cds-text-label>
      </div>
      <!-- Permissions -->
      <div  class="form-item">
        <cds-text-label>{{ permissionsLabel }}</cds-text-label>
        <cd-checked-table-form [data]="scopes_permissions"
                               [columns]="columns"
                               [form]="roleForm"
                               inputField="scopes_permissions"
                               [scopes]="scopes"
                               [initialValue]="initialValue"></cd-checked-table-form>
      </div>
      <!--Submit Button-->
      <div class="form-item">
        <cd-form-button-panel (submitActionEvent)="submit()"
                              [form]="roleForm"
                              [submitText]="formTitle"
                              wrappingClass="text-right">
        </cd-form-button-panel>
      </div>
    </form>
  </ng-container>
</div>
