<cds-overflow-menu [customTrigger]="customTrigger"
                   [flip]="true">
  <li>
    <a routerLink="/api-docs"
       target="_blank"
       class="cds--overflow-menu-options__btn">{{ apiLabel }}
      <svg cdsIcon="launch"
           class="ms-2"
           size="16"></svg>
    </a>
  </li>
  <cds-overflow-menu-option (click)="openAboutModal()">{{ aboutLabel }}</cds-overflow-menu-option>
</cds-overflow-menu>

<ng-template #customTrigger>
  <svg cdsIcon="help"
       size="20"
       [attr.title]="helpLabel"
       role="button"></svg>
  <span class="d-md-none">{{ helpLabel }}</span>
</ng-template>
