<cd-orchestrator-doc-panel *ngIf="!hasOrchestrator"></cd-orchestrator-doc-panel>

<div class="card"
     *cdFormLoading="loading">
  <div class="card-header"
       *ngIf="!hideTitle">{{ formTitle }}</div>
  <div class="card-body ms-2">
    <form name="form"
          #formDir="ngForm"
          [formGroup]="form"
          novalidate>
      <cd-alert-panel *ngIf="!deploymentOptions?.recommended_option"
                      type="warning"
                      class="mx-3">
        {{ noDevicesMessage }}
      </cd-alert-panel>
      <div class="accordion">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button"
                    type="button"
                    data-toggle="collapse"
                    [attr.aria-label]="isZhHans ? '切换部署选项' : 'toggle deployment options'"
                    [ngClass]="{collapsed: !simpleDeployment}"
                    (click)="emitDeploymentMode()">{{ deploymentOptionsLabel }}</button>
          </h2>
        </div>
        <div class="accordion-collapse collapse"
             [ngClass]="{show: simpleDeployment}">
          <div class="accordion-body">
            <div class="pt-3 pb-3"
                 *ngFor="let optionName of optionNames">
              <div class="custom-control form-check custom-control-inline">
                <input class="form-check-input"
                       type="radio"
                       name="deploymentOption"
                       [id]="optionName"
                       [value]="optionName"
                       formControlName="deploymentOption"
                       (change)="emitDeploymentSelection()"
                       [attr.disabled]="!deploymentOptions?.options[optionName].available ? true : null">
                <label class="form-check-label"
                       [id]="'label_' + optionName"
                       [for]="optionName"
                       >{{ getDeploymentOptionTitle(optionName) }}
                       {{ deploymentOptions?.recommended_option === optionName ? recommendedLabel : "" }}
                  <cd-helper>
                    <span>{{ getDeploymentOptionDesc(optionName) }}</span>
                  </cd-helper>
                </label>
              </div>
            </div>
            <!-- @TODO: Visualize the storage used on a chart -->
            <!-- <div class="pie-chart">
              <h4 class="text-center">{{ selectedCapacityTitle }}</h4>
              <h5 class="margin text-center">{{ selectedCapacitySummary }} </h5>
              <div class="char-i-contain">
                <cd-health-pie [data]="data"
                               [config]="rawCapacityChartConfig"
                               [isBytesData]="true"
                               (prepareFn)="prepareRawUsage($event[0], $event[1])">
                </cd-health-pie>
              </div>
            </div> -->
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button"
                    type="button"
                    [attr.aria-label]="isZhHans ? '切换高级模式' : 'toggle advanced mode'"
                    [ngClass]="{collapsed: simpleDeployment}"
                    (click)="emitDeploymentMode()">{{ advancedModeLabel }}</button>
          </h2>
        </div>
        <div class="accordion-collapse collapse"
             [ngClass]="{show: !simpleDeployment}">
          <div class="accordion-body">
            <div class="card-body">
              <fieldset>
                <cd-osd-devices-selection-groups #dataDeviceSelectionGroups
                                                 [name]="primaryDevicesLabel"
                                                 type="data"
                                                 [availDevices]="availDevices"
                                                 [canSelect]="availDevices.length !== 0"
                                                 (selected)="onDevicesSelected($event)"
                                                 (cleared)="onDevicesCleared($event)">
                </cd-osd-devices-selection-groups>
              </fieldset>

              <!-- Shared devices -->
              <fieldset>
                <legend>{{ sharedDevicesLabel }}</legend>

                <!-- WAL devices button and table -->
                <cd-osd-devices-selection-groups #walDeviceSelectionGroups
                                                 [name]="walDevicesLabel"
                                                 type="wal"
                                                 [availDevices]="availDevices"
                                                 [canSelect]="dataDeviceSelectionGroups.devices.length !== 0"
                                                 (selected)="onDevicesSelected($event)"
                                                 (cleared)="onDevicesCleared($event)"
                                                 [hostname]="hostname">
                </cd-osd-devices-selection-groups>

                <!-- WAL slots -->
                <div class="form-group row"
                     *ngIf="walDeviceSelectionGroups.devices.length !== 0">
                  <label class="cd-col-form-label"
                         for="walSlots">
                    <ng-container>{{ getWalSlotsLabel() }}</ng-container>
                    <cd-helper>
                      <span>{{ getWalSlotsHelper() }}</span>
                      <br>
                      <span>{{ getOrchestratorDecisionHelper() }}</span>
                    </cd-helper>
                  </label>
                  <div class="cd-col-form-input">
                    <input class="form-control"
                           id="walSlots"
                           name="walSlots"
                           type="number"
                           min="0"
                           formControlName="walSlots">
                    <span class="invalid-feedback"
                          *ngIf="form.showError('walSlots', formDir, 'min')"
                          i18n>Value should be greater than or equal to 0</span>
                  </div>
                </div>

                <!-- DB devices button and table -->
                <cd-osd-devices-selection-groups #dbDeviceSelectionGroups
                                                 [name]="dbDevicesLabel"
                                                 type="db"
                                                 [availDevices]="availDevices"
                                                 [canSelect]="dataDeviceSelectionGroups.devices.length !== 0"
                                                 (selected)="onDevicesSelected($event)"
                                                 (cleared)="onDevicesCleared($event)"
                                                 [hostname]="hostname">
                </cd-osd-devices-selection-groups>

                <!-- DB slots -->
                <div class="form-group row"
                     *ngIf="dbDeviceSelectionGroups.devices.length !== 0">
                  <label class="cd-col-form-label"
                         for="dbSlots">
                    <ng-container>{{ getDbSlotsLabel() }}</ng-container>
                    <cd-helper>
                      <span>{{ getDbSlotsHelper() }}</span>
                      <br>
                      <span>{{ getOrchestratorDecisionHelper() }}</span>
                    </cd-helper>
                  </label>
                  <div class="cd-col-form-input">
                    <input class="form-control"
                           id="dbSlots"
                           name="dbSlots"
                           type="number"
                           min="0"
                           formControlName="dbSlots">
                    <span class="invalid-feedback"
                          *ngIf="form.showError('dbSlots', formDir, 'min')"
                          i18n>Value should be greater than or equal to 0</span>
                  </div>
                </div>
              </fieldset>
            </div>
          </div>
        </div>

        <!-- Features -->
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button"
                    type="button"
                    data-toggle="collapse"
                    [attr.aria-label]="isZhHans ? '功能特性' : 'features'"
                    aria-expanded="true"
                    >{{ featuresLabel }}</button>
          </h2>
        </div>
        <div class="accordion-collapse collapse show">
          <div class="accordion-body">
            <div class="pt-3 pb-3"
                 formGroupName="features">
              <div class="custom-control custom-checkbox"
                   *ngFor="let feature of featureList">
                <input type="checkbox"
                       class="custom-control-input"
                       id="{{ feature.key }}"
                       name="{{ feature.key }}"
                       formControlName="{{ feature.key }}"
                       (change)="emitDeploymentSelection()">
                <label class="custom-control-label"
                       for="{{ feature.key }}">{{ getFeatureLabel(feature) }}</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="card-footer"
       *ngIf="!hideSubmitBtn">
    <cd-form-button-panel #previewButtonPanel
                          (submitActionEvent)="submit()"
                          [form]="form"
                          [disabled]="dataDeviceSelectionGroups.devices.length === 0 && !simpleDeployment"
                          [submitText]="simpleDeployment ? createOsdsLabel : actionLabels.PREVIEW"
                          wrappingClass="text-right"></cd-form-button-panel>
  </div>
</div>
