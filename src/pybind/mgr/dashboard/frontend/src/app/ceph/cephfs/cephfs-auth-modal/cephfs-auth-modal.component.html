<cds-modal size="md"
           [open]="open"
           (overlaySelected)="closeModal()">
  <cds-modal-header (closeSelect)="closeModal()">
    <h3 cdsModalHeaderHeading>{{ formTitle }}</h3>
  </cds-modal-header>
  <ng-container *cdFormLoading="loading">
    <section class="cds--modal-content">
      <form name="form"
            #formDir="ngForm"
            [formGroup]="form">

      <!-- FsName -->
      <div class="form-item">
        <cds-text-label for="fsName"
                        [cdRequiredField]="fsNameLabel"
                        [invalid]="!form.controls['fsName'].valid && (form.controls['fsName'].dirty)"
                        [invalidText]="fsNameError">{{ fsNameLabel }}
          <input cdsText
                 [placeholder]="namePlaceholder"
                 id="fsName"
                 name="fsName"
                 formControlName="fsName"
                 size="sm"
                 [invalid]="!form.controls['fsName'].valid && (form.controls['fsName'].dirty)"
                 autofocus>
        </cds-text-label>
        <ng-template #fsNameError>
          <span class="invalid-feedback"
                *ngIf="form.showError('fsName', formDir, 'required')"
                i18n>This field is required.</span>
        </ng-template>
      </div>

      <!-- UserId -->
      <div class="form-item">
        <cds-text-label for="userId"
                        [cdRequiredField]="userIdLabel"
                        [helperText]="userIdHelperText"
                        [invalid]="!form.controls['userId'].valid && (form.controls['userId'].dirty)"
                        [invalidText]="userIdError">{{ userIdLabel }}
          <input cdsText
                 value="client."
                 readonly>

          <input cdsText
                 [placeholder]="namePlaceholder"
                 id="userId"
                 name="userId"
                 formControlName="userId"
                 [invalid]="!form.controls['userId'].valid && (form.controls['userId'].dirty)">
        </cds-text-label>
        <ng-template #userIdHelperText>
          {{ storageUsersHelperPrefix }}
          <a routerLink="/ceph-users"
             (click)="closeModal()">{{ storageUsersLabel }}</a>
          {{ storageUsersHelperSuffix }}
        </ng-template>
        <ng-template #userIdError>
          <span class="invalid-feedback"
                *ngIf="form.showError('userId', formDir, 'required')"
                i18n>This field is required.</span>
        </ng-template>
      </div>

      <!-- Directory -->
      <div class="form-item">
        <cds-text-label for="directory"
                        [cdRequiredField]="directoryLabel"
                        [invalid]="!form.controls['directory'].valid && (form.controls['directory'].dirty)"
                        [invalidText]="directoryError"
                        [helperText]="directoryHelperText"
                        [skeleton]="directoryStore.isLoading"
                        >{{ directoryLabel }}
          <input cdsText
                 type="text"
                 [placeholder]="directoryStore.isLoading ? '' : directoryPlaceholder"
                 id="directory"
                 name="directory"
                 formControlName="directory"
                 [skeleton]="directoryStore.isLoading"
                 [invalid]="!form.controls['directory'].valid && (form.controls['directory'].dirty)"
                 [ngbTypeahead]="search">
        </cds-text-label>
        <ng-template #directoryError>
          <span class="invalid-feedback"
                *ngIf="form.showError('directory', formDir, 'required')"
                i18n>This field is required.</span>
        </ng-template>
      </div>

      <!-- Permissions -->
      <div class="form-item">
        <fieldset>
          <label class="cds--label">{{ permissionsLabel }}</label>
            <ng-container *ngFor="let permission of clientPermissions">
              <cds-checkbox i18n-label
                            [id]="permission.name"
                            [name]="permission.name"
                            [formControlName]="permission.name">
              {{ permission.name | titlecase }}
              <cd-help-text *ngIf="permission.description">
                {{ permission.description }}
              </cd-help-text>
            </cds-checkbox>
          </ng-container>
        </fieldset>
        </div>
      </form>
    </section>
    <cd-form-button-panel (submitActionEvent)="onSubmit()"
                          [form]="form"
                          [submitText]="submitText"
                          [modalForm]="true"></cd-form-button-panel>
  </ng-container>
</cds-modal>
