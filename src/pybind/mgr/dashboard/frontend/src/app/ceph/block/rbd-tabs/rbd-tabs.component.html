<ul class="nav nav-tabs">
  <li class="nav-item">
    <a class="nav-link"
       routerLink="/block/rbd"
       routerLinkActive="active"
       ariaCurrentWhenActive="page"
       [routerLinkActiveOptions]="{exact: true}">{{ imagesLabel }}</a>
  </li>
  <li class="nav-item">
    <a class="nav-link"
       routerLink="/block/rbd/namespaces"
       routerLinkActive="active"
       ariaCurrentWhenActive="page"
       [routerLinkActiveOptions]="{exact: true}">{{ namespacesLabel }}</a>
  </li>
  <li class="nav-item">
    <a class="nav-link"
       routerLink="/block/rbd/trash"
       routerLinkActive="active"
       ariaCurrentWhenActive="page"
       [routerLinkActiveOptions]="{exact: true}">{{ trashLabel }}</a>
  </li>
  <li class="nav-item"
      *ngIf="grafanaPermission.read">
    <a class="nav-link"
       routerLink="/block/rbd/performance"
       routerLinkActive="active"
       ariaCurrentWhenActive="page"
       [routerLinkActiveOptions]="{exact: true}">{{ performanceLabel }}</a>
  </li>
</ul>
